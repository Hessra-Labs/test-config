# Version of the config file format
version = "0.2.0"

# Resource Definitions and Authorization Policies
#
# This configuration defines resources and their authorization requirements.
# Resources can be defined as service chains, where each node in the chain
# represents a component that needs to verify and attest the token.
#
# Service chains can represent:
# - Microservice architectures
# - Edge function pipelines
# - Linux program pipelines
# - Any other chain of components requiring authorization
#
# The goal is to provide templates and SDKs that handle authorization
# logic automatically, eliminating the need for custom authorization
# implementations by users.

# Future Enhancements:
# - Add templating for resources with advanced configuration options

# Resource Definitions
[resources.resource4]
mechanisms = ["service_chain"]

[resources.resource4.service_chain]
nodes = [
  # Nodes are processed in strict order from first to last
  { component = "edge_function", public_key = "ed25519/9c3e8f10e0e8eeef1db086915a15a590e7d838683841719b5e70ddab2115b826" },
]

[resources.order_service]
mechanisms = ["service_chain"]

[resources.order_service.service_chain]
nodes = [
  { component = "auth_service", public_key = "ed25519/e57618058b1d2e0381a9813c1405830d5ed7d603717384ef555d9cc0cfa65d83" },
  { component = "payment_service", public_key = "ed25519/78ef4255c4c9ab5c7186d6db4760758b06616c042a2538323ae3b058094034b6" },
  { component = "order_service", public_key = "ed25519/1aebc5a6eefc569051926a6aaf55568e53edb475f2f2eb904522609391d88113" },
]

[resources.waitlist_service]
mechanisms = ["service_chain"]

[resources.waitlist_service.service_chain]
nodes = [
  { component = "mage1", public_key = "ed25519/1ebf1d1f8ac10e68beaf131bd88bf5073ed38466677504427e83b51abe55e0ba" },
]

# Multi-party authorization
# This configuration demonstrates a multi-party authorization flow where the
# authorization token issued for the resource needs to be signed by another
# authorization service.
# In this example, the authorization service will be signed by the same service,
# test.hessra.net, but in practice it should be a different service.
[resources.update_telemetry]
mechanisms = ["multi_party", "signoff"]

[resources.update_telemetry.multi_party]
nodes = [
  { component = "test.hessra.net", public_key = "secp256r1/03beee669b84c0d4f76d902d149d94fa3beaaca99c60be497b52f9ef721fe8b0c7", authorization_service = "https://test.hessra.net/sign_token" }
]

[resources.update_telemetry.signoff]
first_party_service = "test.hessra.net"
first_party_public_key = "secp256r1/03beee669b84c0d4f76d902d149d94fa3beaaca99c60be497b52f9ef721fe8b0c7"


# Composable authorization - both service chain and multi-party
[resources.sync_event]
mechanisms = ["multi_party", "service_chain"]

[resources.sync_event.service_chain]
nodes = [
  { component = "notification_service", public_key = "ed25519/c4f4ab49c9bef58b1f2a0984b0f8d57a427003a997860af27d4677d1acff860e" },
]

[resources.sync_event.multi_party]
nodes = [
  { component = "test.hessra.net", public_key = "secp256r1/03beee669b84c0d4f76d902d149d94fa3beaaca99c60be497b52f9ef721fe8b0c7", authorization_service = "https://test.hessra.net/sign_token" }
]

[resources.sync_event.signoff]
first_party_service = "test.hessra.net"
first_party_public_key = "secp256r1/03beee669b84c0d4f76d902d149d94fa3beaaca99c60be497b52f9ef721fe8b0c7"
# Hessra Client Authentication and Authorization Configuration
#
# Capability Model:
# - Each client is identified by a SAN URI from its mTLS certificate
# - Resources are granted directly to clients as capabilities (name + operations)
# - Identity tokens enable stateless authentication after initial mTLS handshake
# - Delegation allows services to create sub-identities for their users
#   via Biscuit token attenuation -- no domain RBAC, all access is through
#   direct capability grants
#
# Identity Token Configuration Options:
# - identity_token_enabled: Whether this client can request identity tokens (default: false)
# - identity_token_duration: Duration in seconds for issued identity tokens (default: 3600)
# - delegatable_identity_token: Whether identity tokens can be delegated to sub-identities (default: false)
#   Services use delegation to create user identities from their own identity token.
#
# This file is shared across test suites. Keep SAN URIs consistent with
# certificates in authz-node/tls/.


# Service-level client definitions
# Each client is identified by a SAN URI from its mTLS certificate
# and is granted access to specific resources.

# Service with delegation capability
# Can delegate its identity to create hierarchical sub-identities for users
[[clients]]
identifier = { type = "san_uri", value = "uri:urn:test:argo-cli0" }
resources = [ { name = "resource1", operations = ["read", "write"] }, { name = "resource2", operations = ["read", "write"] }, { name = "resource4", operations = ["read", "write"] }, { name = "order_service", operations = ["read", "write"] }, { name = "update_telemetry", operations = ["update"] } ]
identity_token_enabled = true
identity_token_duration = 7200  # 2 hours
delegatable_identity_token = true

# Delegated sub-identity
# This is a sub-identity of argo-cli0 with restricted permissions
[[clients]]
identifier = { type = "san_uri", value = "uri:urn:test:argo-cli0:agent1" }
resources = [ { name = "resource4", operations = ["read"] } ]
identity_token_enabled = true
identity_token_duration = 3600  # 1 hour

# Service with control plane access and delegation (hessra-control-api)
# This service manages its own users via identity delegation.
# It receives a delegatable capability from authz-node and is responsible
# for designating/delegating to its own users based on local policy.
[[clients]]
identifier = { type = "san_uri", value = "uri:urn:test:argo-cli1" }
resources = [
    { name = "resource2", operations = ["read", "write"] },
    { name = "resource3", operations = ["read", "write"] },
    { name = "resource4", operations = ["read", "write"] },
    { name = "order_service", operations = ["read", "write"] },
    { name = "update_telemetry", operations = ["update"] },
    { name = "console", operations = ["read", "write"] },
    # Control plane resources
    { name = "tokens.identity.read", operations = ["read"] },
    { name = "tokens.authorization.read", operations = ["read"] },
    { name = "tenants.config.read", operations = ["read"] },
    { name = "revocations.read", operations = ["read"] },
    { name = "revocations.write", operations = ["write"] },
    { name = "revocations.delete", operations = ["delete"] },
]
identity_token_enabled = true
identity_token_duration = 3600  # 1 hour
delegatable_identity_token = true

[[clients]]
identifier = { type = "san_uri", value = "uri:urn:test:mage0" }
resources = [ { name = "waitlist_service", operations = ["read", "write"] } ]
